<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>QUIX — Voice</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Syne:wght@700;800&display=swap');

    :root {
      color-scheme: dark;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      height: 100%;
    }

    body {
      background: #050508;
      color: rgba(255,255,255,.85);
      font-family: 'DM Sans', sans-serif;
      overflow: hidden;
    }

    .loading {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: #050508;
      display: grid;
      place-items: center;
      opacity: 1;
      transition: opacity .55s ease;
    }

    .loading.hide {
      opacity: 0;
      pointer-events: none;
    }

    .loading-logo {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 34px;
      letter-spacing: .18em;
      background: linear-gradient(90deg, rgba(255,255,255,.14) 0%, #fff 35%, rgba(255,255,255,.14) 70%);
      background-size: 220% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: shimmer 1.2s linear infinite;
    }

    .loading-brand {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 22px;
      text-align: center;
      font-size: 10px;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: rgba(255,255,255,.16);
    }

    @keyframes shimmer {
      to {
        background-position: -220% 0;
      }
    }

    .app {
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 22px 8px;
      flex-shrink: 0;
    }

    .brand {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 19px;
      letter-spacing: .14em;
      color: rgba(255,255,255,.95);
    }

    .meta {
      font-size: 11px;
      color: rgba(255,255,255,.25);
      letter-spacing: .08em;
    }

    .stage {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 26px;
      padding: 22px;
      overflow: auto;
      scrollbar-width: none;
      transition: opacity .35s ease, transform .35s ease;
    }

    .stage::-webkit-scrollbar {
      width: 0;
    }

    .orb-zone {
      position: relative;
      width: min(320px, 76vw);
      aspect-ratio: 1 / 1;
      display: grid;
      place-items: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .orb-zone:active .orb {
      transform: scale(.985);
    }

    .orb {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background:
        radial-gradient(
          circle at 30% 22%,
          rgba(255,255,255,.13) 0%,
          rgba(255,255,255,.05) 28%,
          rgba(255,255,255,.02) 62%,
          rgba(255,255,255,.05) 100%
        );
      border: 1px solid rgba(255,255,255,.12);
      backdrop-filter: blur(24px) saturate(160%) brightness(1.08);
      -webkit-backdrop-filter: blur(24px) saturate(160%) brightness(1.08);
      box-shadow:
        0 24px 80px rgba(0,0,0,.42),
        0 1px 0 rgba(255,255,255,.08) inset,
        0 -18px 44px rgba(0,0,0,.22) inset;
      transition: transform .35s ease, border-color .35s ease, box-shadow .35s ease;
      animation: breath 4.2s ease-in-out infinite;
    }

    .orb::before {
      content: '';
      position: absolute;
      inset: 10px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,.05);
    }

    .core {
      position: absolute;
      width: 108px;
      height: 108px;
      border-radius: 50%;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.12);
      box-shadow:
        0 0 0 18px rgba(255,255,255,.018),
        0 0 44px rgba(255,255,255,.05) inset;
      display: grid;
      place-items: center;
      transition: transform .35s ease, background .35s ease;
      z-index: 2;
    }

    .core svg {
      opacity: .82;
    }

    .wave-bars {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      pointer-events: none;
      z-index: 1;
    }

    .wave-bars span {
      width: 3px;
      height: calc(16px + var(--h, 12px));
      border-radius: 999px;
      background: rgba(255,255,255,.52);
      opacity: .24;
      transform-origin: center;
      transition: opacity .25s ease;
    }

    .status {
      min-height: 24px;
      font-size: 15px;
      color: rgba(255,255,255,.58);
      letter-spacing: .01em;
      text-align: center;
      transition: color .25s ease;
    }

    .captions {
      width: min(700px, 100%);
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .caption {
      padding: 12px 14px;
      border-radius: 16px;
      background: rgba(255,255,255,.042);
      border: 1px solid rgba(255,255,255,.09);
      backdrop-filter: blur(24px) saturate(160%) brightness(1.08);
      -webkit-backdrop-filter: blur(24px) saturate(160%) brightness(1.08);
      box-shadow:
        0 12px 30px rgba(0,0,0,.18),
        0 1px 0 rgba(255,255,255,.05) inset;
    }

    .caption-label {
      font-size: 9.5px;
      text-transform: uppercase;
      letter-spacing: .14em;
      color: rgba(255,255,255,.22);
      margin-bottom: 7px;
    }

    .caption-text {
      min-height: 20px;
      font-size: 14px;
      line-height: 1.55;
      color: rgba(255,255,255,.72);
      overflow-wrap: break-word;
    }

    .controls {
      padding: 18px 20px calc(24px + env(safe-area-inset-bottom));
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .btn {
      min-height: 52px;
      padding: 14px 22px;
      border-radius: 16px;
      border: 1px solid transparent;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition:
        transform .18s ease,
        background .25s ease,
        border-color .25s ease,
        box-shadow .25s ease,
        opacity .25s ease;
      user-select: none;
    }

    .btn svg {
      transition: transform .35s cubic-bezier(.4,0,.2,1);
    }

    .btn.press {
      transform: scale(.955);
    }

    .btn.press svg {
      transform: rotate(360deg) scale(.9);
    }

    .primary {
      background: #fff;
      color: #000;
      min-width: 250px;
      box-shadow: 0 10px 28px rgba(0,0,0,.25);
    }

    .primary:hover {
      background: #e9e9e9;
    }

    .secondary {
      background: rgba(255,255,255,.055);
      color: rgba(255,255,255,.9);
      border-color: rgba(255,255,255,.13);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    .secondary:hover {
      background: rgba(255,255,255,.09);
    }

    .hidden {
      display: none !important;
    }

    .stage[data-state='listening'] .orb {
      border-color: rgba(255,255,255,.24);
      transform: scale(1.025);
      box-shadow:
        0 24px 80px rgba(0,0,0,.42),
        0 0 46px rgba(255,255,255,.05),
        0 1px 0 rgba(255,255,255,.08) inset,
        0 -18px 44px rgba(0,0,0,.22) inset;
    }

    .stage[data-state='listening'] .wave-bars span {
      animation: wave 900ms ease-in-out infinite;
      opacity: .58;
    }

    .stage[data-state='thinking'] .orb {
      transform: scale(.985);
      animation: pulse 1.15s ease-in-out infinite;
    }

    .stage[data-state='thinking'] .core {
      background: rgba(255,255,255,.115);
    }

    .stage[data-state='thinking'] .wave-bars span {
      animation: pulseBar 900ms ease-in-out infinite;
      opacity: .48;
    }

    .stage[data-state='speaking'] .orb {
      transform: scale(1.02);
      border-color: rgba(255,255,255,.22);
      box-shadow:
        0 24px 80px rgba(0,0,0,.42),
        0 0 70px rgba(255,255,255,.09),
        0 1px 0 rgba(255,255,255,.08) inset,
        0 -18px 44px rgba(0,0,0,.22) inset;
    }

    .stage[data-state='speaking'] .wave-bars span {
      animation: wave 620ms ease-in-out infinite;
      opacity: .82;
    }

    @keyframes breath {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.014);
      }
    }

    @keyframes wave {
      0%, 100% {
        transform: scaleY(.42);
      }
      50% {
        transform: scaleY(1.45);
      }
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(.985);
        opacity: .96;
      }
      50% {
        transform: scale(1.005);
        opacity: 1;
      }
    }

    @keyframes pulseBar {
      0%, 100% {
        transform: scaleY(.65);
        opacity: .32;
      }
      50% {
        transform: scaleY(1.08);
        opacity: .62;
      }
    }

    @media (max-width: 640px) {
      .orb-zone {
        width: min(260px, 82vw);
      }

      .core {
        width: 88px;
        height: 88px;
      }

      .captions {
        width: 100%;
      }

      .primary {
        min-width: min(100%, 320px);
      }
    }
  </style>
</head>
<body>
  <div class="loading" id="loading">
    <div class="loading-logo">QUIX</div>
    <div class="loading-brand">From Verve</div>
  </div>

  <main class="app">
    <header class="topbar">
      <div class="brand">QUIX</div>
      <div class="meta">Voice Call · v2.0</div>
    </header>

    <section class="stage" id="stage" data-state="idle">
      <div class="orb-zone" id="orbZone">
        <div class="orb"></div>

        <div class="core">
          <svg
            width="26"
            height="26"
            viewBox="0 0 24 24"
            fill="none"
            stroke="white"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M12 2a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3Z"></path>
            <path d="M19 10v1a7 7 0 0 1-14 0v-1"></path>
            <path d="M12 18v4"></path>
          </svg>
        </div>

        <div class="wave-bars" id="waveBars"></div>
      </div>

      <div class="status" id="status">Tap start and talk. I’ll listen.</div>

      <div class="captions">
        <div class="caption">
          <div class="caption-label">You</div>
          <div class="caption-text" id="userCaption">—</div>
        </div>

        <div class="caption">
          <div class="caption-label">Quix</div>
          <div class="caption-text" id="quixCaption">Ready when you are.</div>
        </div>
      </div>
    </section>

    <div class="controls">
      <button class="btn primary" id="startBtn">
        <svg
          width="17"
          height="17"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.9"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M12 2a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3Z"></path>
          <path d="M19 10v1a7 7 0 0 1-14 0v-1"></path>
          <path d="M12 18v4"></path>
        </svg>
        Start Voice Call
      </button>

      <button class="btn secondary hidden" id="endBtn">
        <svg
          width="17"
          height="17"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.9"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.79 19.79 0 0 1 2.08 4.18 2 2 0 0 1 4.06 2h3a2 2 0 0 1 2 1.72c.12.81.3 1.6.54 2.36a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.72-1.06a2 2 0 0 1 2.11-.45c.76.24 1.55.42 2.36.54A2 2 0 0 1 22 16.92z"
            transform="rotate(135 12 12)"
          ></path>
        </svg>
        End Call
      </button>
    </div>
  </main>

  <script>
    const loading = document.getElementById('loading');
    const hideLoading = () => loading.classList.add('hide');

    window.addEventListener('load', () => setTimeout(hideLoading, 650));
    setTimeout(hideLoading, 2600);

    const waveBars = document.getElementById('waveBars');

    for (let i = 0; i < 24; i++) {
      const bar = document.createElement('span');
      bar.style.setProperty('--h', `${8 + Math.sin(i * 0.82) * 10 + (i % 5) * 3}px`);
      bar.style.animationDelay = `${i * 34}ms`;
      waveBars.appendChild(bar);
    }

    const stage = document.getElementById('stage');
    const statusEl = document.getElementById('status');
    const userCaption = document.getElementById('userCaption');
    const quixCaption = document.getElementById('quixCaption');
    const startBtn = document.getElementById('startBtn');
    const endBtn = document.getElementById('endBtn');
    const orbZone = document.getElementById('orbZone');

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    let recognition = null;
    let callActive = false;
    let thinking = false;
    let speaking = false;
    let buffer = '';
    let interimText = '';
    let silenceTimer = null;
    let voices = [];
    let currentAudio = null;

    const history = [];

    function setStatus(text) {
      statusEl.textContent = text;
    }

    function setState(state) {
      stage.dataset.state = state;

      if (state === 'idle') {
        setStatus('Tap start and talk. I’ll listen.');
      }

      if (state === 'listening') {
        setStatus('Listening...');
      }

      if (state === 'thinking') {
        setStatus('Thinking...');
      }

      if (state === 'speaking') {
        setStatus('Quix is speaking... tap orb to interrupt.');
      }
    }

    function showCall(on) {
      startBtn.classList.toggle('hidden', on);
      endBtn.classList.toggle('hidden', !on);
    }

    function press(btn, fn) {
      btn.classList.add('press');
      setTimeout(() => {
        btn.classList.remove('press');
        fn();
      }, 140);
    }

    startBtn.addEventListener('click', () => press(startBtn, startCall));
    endBtn.addEventListener('click', () => press(endBtn, endCall));

    orbZone.addEventListener('click', () => {
      if (!callActive) return;

      if (speaking) {
        stopSpeaking();
        resumeListening();
      }
    });

    if ('speechSynthesis' in window) {
      const loadVoices = () => {
        voices = speechSynthesis.getVoices();
      };

      loadVoices();
      speechSynthesis.onvoiceschanged = loadVoices;
    }

    if (!SpeechRecognition) {
      startBtn.disabled = true;
      startBtn.style.opacity = '.45';
      startBtn.style.cursor = 'not-allowed';
      setStatus('Speech recognition is not supported in this browser.');
    } else {
      initRecognition();
    }

    function initRecognition() {
      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.lang = navigator.language || 'en-US';

      recognition.onresult = (event) => {
        if (!callActive || speaking || thinking) return;

        interimText = '';

        for (let i = event.resultIndex; i < event.results.length; i++) {
          const chunk = event.results[i][0].transcript || '';

          if (event.results[i].isFinal) {
            buffer = `${buffer} ${chunk}`.trim();
          } else {
            interimText += chunk;
          }
        }

        const live = [buffer, interimText].filter(Boolean).join(' ');

        if (live) {
          userCaption.textContent = live;
        }

        clearTimeout(silenceTimer);

        if (live.trim()) {
          silenceTimer = setTimeout(() => {
            const text = (buffer.trim() || live.trim()).slice(0, 500);
            if (text) sendToQuix(text);
          }, 900);
        }
      };

      recognition.onerror = (event) => {
        if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
          callActive = false;
          showCall(false);
          setState('idle');
          setStatus('Mic blocked. Allow mic and try again.');
          return;
        }

        if (callActive && !speaking && !thinking) {
          setTimeout(safeStart, 250);
        }
      };

      recognition.onend = () => {
        if (callActive && !speaking && !thinking) {
          setTimeout(safeStart, 180);
        }
      };
    }

    function safeStart() {
      if (!recognition || !callActive) return;

      try {
        recognition.start();
        setState('listening');
      } catch (e) {}
    }

    function stopRecognition() {
      if (!recognition) return;

      try {
        if (recognition.abort) {
          recognition.abort();
        } else {
          recognition.stop();
        }
      } catch (e) {}
    }

    function stopSpeaking() {
      if (currentAudio) {
        currentAudio.pause();
        currentAudio = null;
      }

      if ('speechSynthesis' in window) {
        speechSynthesis.cancel();
      }

      speaking = false;
    }

    function startCall() {
      if (!SpeechRecognition) return;

      callActive = true;
      buffer = '';
      interimText = '';
      history.length = 0;

      userCaption.textContent = '—';
      quixCaption.textContent = 'Connected. Speak.';

      showCall(true);
      setState('listening');
      safeStart();
    }

    function endCall() {
      callActive = false;
      thinking = false;

      clearTimeout(silenceTimer);
      stopRecognition();
      stopSpeaking();

      showCall(false);
      setState('idle');
      setStatus('Call ended.');
      userCaption.textContent = '—';
    }

    function cleanForSpeech(text) {
      return String(text || '')
        .replace(/[*_#`~>|]/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
    }

    async function sendToQuix(text) {
      if (!callActive || !text.trim()) return;

      buffer = '';
      interimText = '';
      clearTimeout(silenceTimer);

      const clean = text.trim();
      userCaption.textContent = clean;

      if (/\b(stop|end|hang up|quit)( the)? call\b|\bhang up\b/i.test(clean)) {
        endCall();
        return;
      }

      history.push({
        role: 'user',
        text: clean
      });

      thinking = true;
      setState('thinking');
      stopRecognition();

      let data = {};

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            messages: history.slice(-16)
          })
        });

        data = await res.json().catch(() => ({}));

        if (!res.ok) {
          throw new Error(data.error || 'API failed');
        }

        const reply = cleanForSpeech(data.reply || 'I could not get that.');

        history.push({
          role: 'assistant',
          text: reply
        });

        quixCaption.textContent = reply;
        thinking = false;
        speak(reply);
      } catch (err) {
        thinking = false;
        quixCaption.textContent = (err.message || 'Signal slipped. Try again.').slice(0, 140);

        if (callActive) {
          resumeListening();
        }
      }
    }

    async function speak(text) {
      if (!callActive) return;

      speaking = true;
      setState('speaking');

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            mode: 'tts',
            text
          })
        });

        if (!res.ok) throw new Error('TTS failed');

        const blob = await res.blob();

        if (!blob.size) throw new Error('Empty audio');

        if (!callActive) {
          speaking = false;
          return;
        }

        const url = URL.createObjectURL(blob);
        const audio = new Audio(url);

        currentAudio = audio;

        let done = false;

        const finish = () => {
          if (done) return;
          done = true;

          URL.revokeObjectURL(url);
          currentAudio = null;
          speaking = false;

          if (callActive) resumeListening();
        };

        audio.onended = finish;
        audio.onerror = finish;

        await audio.play();
      } catch (e) {
        currentAudio = null;
        browserSpeak(text);
      }
    }

    function browserSpeak(text) {
      if (!callActive) return;

      speaking = true;
      setState('speaking');

      if (!('speechSynthesis' in window)) {
        setTimeout(() => {
          speaking = false;
          if (callActive) resumeListening();
        }, Math.min(2200, 400 + text.length * 28));
        return;
      }

      speechSynthesis.cancel();

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.rate = 1.03;
      utterance.pitch = 1.05;

      const voice =
        voices.find(v => /en/i.test(v.lang) && /female|samantha|zira|aria|jenny|google us english/i.test(v.name)) ||
        voices.find(v => v.lang.startsWith('en')) ||
        voices[0];

      if (voice) {
        utterance.voice = voice;
      }

      utterance.onend = () => {
        speaking = false;
        if (callActive) resumeListening();
      };

      utterance.onerror = () => {
        speaking = false;
        if (callActive) resumeListening();
      };

      speechSynthesis.speak(utterance);
    }

    function resumeListening() {
      if (!callActive) return;
      setState('listening');
      safeStart();
    }
  </script>
</body>
</html>
