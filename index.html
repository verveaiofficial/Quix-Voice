<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>QUIX — Voice</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Syne:wght@700;800&display=swap');

    :root { color-scheme: dark; }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body { background: #050508; color: rgba(255,255,255,.85); font-family: 'DM Sans', sans-serif; overflow: hidden; }

    .loading { position: fixed; inset: 0; z-index: 100; background: #050508; display: grid; place-items: center; opacity: 1; transition: opacity .55s ease; }
    .loading.hide { opacity: 0; pointer-events: none; }
    .loading-logo { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 34px; letter-spacing: .18em; background: linear-gradient(90deg, rgba(255,255,255,.14) 0%, #fff 35%, rgba(255,255,255,.14) 70%); background-size: 220% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: shimmer 1.2s linear infinite; }
    .loading-brand { position: absolute; left: 0; right: 0; bottom: 22px; text-align: center; font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: rgba(255,255,255,.16); }
    @keyframes shimmer { to { background-position: -220% 0; } }

    .app { height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
    .topbar { display: flex; align-items: center; justify-content: space-between; padding: 20px 22px 8px; flex-shrink: 0; }
    .brand { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 19px; letter-spacing: .14em; color: rgba(255,255,255,.95); }
    .meta { font-size: 11px; color: rgba(255,255,255,.25); letter-spacing: .08em; }

    .stage { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; padding: 22px; overflow: auto; scrollbar-width: none; }
    .stage::-webkit-scrollbar { width: 0; }

    .orb-zone { position: relative; width: min(320px, 76vw); aspect-ratio: 1 / 1; display: grid; place-items: center; cursor: pointer; flex-shrink: 0; }
    .orb-shell { position: absolute; inset: 0; border-radius: 50%; overflow: hidden; border: 1px solid rgba(255,255,255,.14); box-shadow: 0 24px 80px rgba(0,0,0,.42), 0 1px 0 rgba(255,255,255,.08) inset, 0 -18px 44px rgba(0,0,0,.22) inset; transition: transform .35s ease, box-shadow .35s ease, border-color .35s ease; }
    .orb-shell canvas { width: 100%; height: 100%; display: block; }
    .orb-zone:active .orb-shell { transform: scale(.97); }

    .status { min-height: 24px; font-size: 15px; color: rgba(255,255,255,.58); letter-spacing: .01em; text-align: center; }

    .captions { width: min(700px, 100%); display: grid; grid-template-columns: 1fr; gap: 10px; }
    .caption { padding: 12px 14px; border-radius: 16px; background: rgba(255,255,255,.042); border: 1px solid rgba(255,255,255,.09); backdrop-filter: blur(24px) saturate(160%) brightness(1.08); -webkit-backdrop-filter: blur(24px) saturate(160%) brightness(1.08); box-shadow: 0 12px 30px rgba(0,0,0,.18), 0 1px 0 rgba(255,255,255,.05) inset; }
    .caption-label { font-size: 9.5px; text-transform: uppercase; letter-spacing: .14em; color: rgba(255,255,255,.22); margin-bottom: 7px; }
    .caption-text { min-height: 20px; font-size: 14px; line-height: 1.55; color: rgba(255,255,255,.72); overflow-wrap: break-word; }

    .controls { padding: 18px 20px calc(24px + env(safe-area-inset-bottom)); display: flex; justify-content: center; gap: 12px; flex-shrink: 0; }
    .btn { min-height: 52px; padding: 14px 22px; border-radius: 16px; border: 1px solid transparent; display: inline-flex; align-items: center; justify-content: center; gap: 10px; font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 600; cursor: pointer; transition: transform .18s ease, background .25s ease, border-color .25s ease, box-shadow .25s ease, opacity .25s ease; user-select: none; }
    .btn svg { transition: transform .35s cubic-bezier(.4,0,.2,1); }
    .btn.press { transform: scale(.955); }
    .btn.press svg { transform: rotate(360deg) scale(.9); }
    .primary { background: #fff; color: #000; min-width: 250px; box-shadow: 0 10px 28px rgba(0,0,0,.25); }
    .primary:hover { background: #e9e9e9; }
    .secondary { background: rgba(255,255,255,.055); color: rgba(255,255,255,.9); border-color: rgba(255,255,255,.13); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
    .secondary:hover { background: rgba(255,255,255,.09); }
    .hidden { display: none !important; }

    .stage[data-state='listening'] .orb-shell { transform: scale(1.02); border-color: rgba(255,255,255,.22); }
    .stage[data-state='thinking'] .orb-shell { transform: scale(.985); }
    .stage[data-state='speaking'] .orb-shell { transform: scale(1.03); border-color: rgba(255,255,255,.24); box-shadow: 0 24px 80px rgba(0,0,0,.42), 0 0 70px rgba(110,95,255,.14), 0 1px 0 rgba(255,255,255,.08) inset, 0 -18px 44px rgba(0,0,0,.22) inset; }

    @media (max-width: 640px) {
      .orb-zone { width: min(260px, 82vw); }
      .captions { width: 100%; }
      .primary { min-width: min(100%, 320px); }
    }
  </style>
</head>
<body>
  <div class="loading" id="loading">
    <div class="loading-logo">QUIX</div>
    <div class="loading-brand">From Verve</div>
  </div>

  <main class="app">
    <header class="topbar">
      <div class="brand">QUIX</div>
      <div class="meta">Voice Call · v2.2</div>
    </header>

    <section class="stage" id="stage" data-state="idle">
      <div class="orb-zone" id="orbZone">
        <div class="orb-shell">
          <canvas id="orbCanvas"></canvas>
        </div>
      </div>

      <div class="status" id="status">Tap start and talk. I’ll listen.</div>

      <div class="captions">
        <div class="caption">
          <div class="caption-label">You</div>
          <div class="caption-text" id="userCaption">—</div>
        </div>
        <div class="caption">
          <div class="caption-label">Quix</div>
          <div class="caption-text" id="quixCaption">Ready when you are.</div>
        </div>
      </div>
    </section>

    <div class="controls">
      <button class="btn primary" id="startBtn">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3Z"></path><path d="M19 10v1a7 7 0 0 1-14 0v-1"></path><path d="M12 18v4"></path></svg>
        Start Voice Call
      </button>
      <button class="btn secondary hidden" id="endBtn">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.79 19.79 0 0 1 2.08 4.18 2 2 0 0 1 4.06 2h3a2 2 0 0 1 2 1.72c.12.81.3 1.6.54 2.36a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.72-1.06a2 2 0 0 1 2.11-.45c.76.24 1.55.42 2.36.54A2 2 0 0 1 22 16.92z" transform="rotate(135 12 12)"></path></svg>
        End Call
      </button>
    </div>
  </main>

  <script>
    const loading = document.getElementById('loading');
    const hideLoading = () => loading.classList.add('hide');
    window.addEventListener('load', () => setTimeout(hideLoading, 650));
    setTimeout(hideLoading, 2600);

    const stage = document.getElementById('stage');
    const statusEl = document.getElementById('status');
    const userCaption = document.getElementById('userCaption');
    const quixCaption = document.getElementById('quixCaption');
    const startBtn = document.getElementById('startBtn');
    const endBtn = document.getElementById('endBtn');
    const orbZone = document.getElementById('orbZone');

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    let recognition = null;
    let callActive = false;
    let thinking = false;
    let speaking = false;
    let silenceTimer = null;
    let voices = [];
    let currentAudio = null;
    
    let finalTranscript = '';
    let interimTranscript = '';

    let audioCtx = null;
    let analyser = null;
    let timeData = null;

    const history = [];

    /* ---------- LIVE ORB ---------- */
    const canvas = document.getElementById('orbCanvas');
    const ctx = canvas.getContext('2d');

    const blobs = [
      { fx: 0.71, fy: 1.13, phase: 0.00, amp: 0.52, r: 90, color: '#00f2ff' },
      { fx: 1.31, fy: 0.83, phase: 1.20, amp: 0.48, r: 84, color: '#ff00c8' },
      { fx: 0.93, fy: 1.41, phase: 2.10, amp: 0.44, r: 78, color: '#39ff14' },
      { fx: 1.17, fy: 0.67, phase: 0.80, amp: 0.50, r: 74, color: '#6e5fff' },
      { fx: 1.53, fy: 1.27, phase: 1.70, amp: 0.38, r: 68, color: '#ff0088' },
      { fx: 0.79, fy: 1.63, phase: 3.00, amp: 0.42, r: 72, color: '#ffff00' },
      { fx: 1.23, fy: 0.91, phase: 4.20, amp: 0.35, r: 66, color: '#00ffdd' },
      { fx: 0.61, fy: 1.37, phase: 5.10, amp: 0.46, r: 80, color: '#a855f7' }
    ];

    const SLOW = 0.12, FAST = 2.2, CYCLE = 5000;
    let W = 185, H = 185, R = 92, cx = 92.5, cy = 92.5, scale = 1;
    let startTime = performance.now(), lastTime = startTime, t = 0;
    let speedSmooth = SLOW, audioLevel = 0;

    function sizeOrb() {
      const rect = canvas.parentElement.getBoundingClientRect();
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const px = Math.max(120, Math.round(rect.width * dpr));
      canvas.width = px; canvas.height = px;
      W = px; H = px; cx = px / 2; cy = px / 2; R = px / 2 - px * 0.004; scale = px / 185;
    }
    window.addEventListener('resize', sizeOrb);

    function currentLevel() {
      if (!analyser || !timeData) return 0;
      analyser.getByteTimeDomainData(timeData);
      let sum = 0;
      for (let i = 0; i < timeData.length; i++) { const v = (timeData[i] - 128) / 128; sum += v * v; }
      return Math.min(1, Math.sqrt(sum / timeData.length) * 4);
    }

    function draw(now) {
      const dt = Math.min(50, now - lastTime); lastTime = now;
      let target;
      if (speaking && analyser) {
        const lvl = currentLevel(); audioLevel += (lvl - audioLevel) * 0.25;
        target = SLOW + (FAST - SLOW) * Math.min(1, 0.18 + audioLevel * 1.4);
      } else {
        audioLevel += (0 - audioLevel) * 0.08;
        const cycleT = (now - startTime) % CYCLE;
        const s = (Math.sin((cycleT / CYCLE) * Math.PI * 2 - Math.PI / 2) + 1) / 2;
        target = SLOW + (FAST - SLOW) * s;
      }
      speedSmooth += (target - speedSmooth) * 0.12;
      t += speedSmooth * dt * 0.001;

      ctx.clearRect(0, 0, W, H);
      ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.clip();

      const bg = ctx.createRadialGradient(cx * 0.84, cy * 0.76, 4, cx, cy, R);
      bg.addColorStop(0.00, '#1a1a2e'); bg.addColorStop(0.30, '#0f1f3d'); bg.addColorStop(0.55, '#2a1b4d'); bg.addColorStop(0.80, '#3d1f4d'); bg.addColorStop(1.00, '#0f2a3d');
      ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
      ctx.globalCompositeOperation = 'screen';

      blobs.forEach(b => {
        const bx = cx + Math.sin(b.fx * t + b.phase) * R * b.amp;
        const by = cy + Math.cos(b.fy * t + b.phase * 1.4) * R * b.amp;
        const pulse = 1 + 0.08 * Math.sin(b.fx * t * 2.3 + b.phase) + audioLevel * 0.25;
        const br = b.r * scale * pulse;
        const grad = ctx.createRadialGradient(bx, by, 0, bx, by, br);
        grad.addColorStop(0.00, b.color + 'cc'); grad.addColorStop(0.35, b.color + '88'); grad.addColorStop(0.70, b.color + '33'); grad.addColorStop(1.00, b.color + '00');
        ctx.beginPath(); ctx.arc(bx, by, br, 0, Math.PI * 2); ctx.fillStyle = grad; ctx.fill();
      });
      ctx.restore(); requestAnimationFrame(draw);
    }
    sizeOrb(); requestAnimationFrame(draw);

    /* ---------- CALL LOGIC ---------- */
    function setStatus(text) { statusEl.textContent = text; }
    function setState(state) {
      stage.dataset.state = state;
      if (state === 'idle') setStatus('Tap start and talk. I’ll listen.');
      if (state === 'listening') setStatus('Listening...');
      if (state === 'thinking') setStatus('Thinking...');
      if (state === 'speaking') setStatus('Quix is speaking... tap orb to interrupt.');
    }
    function showCall(on) { startBtn.classList.toggle('hidden', on); endBtn.classList.toggle('hidden', !on); }
    function press(btn, fn) { btn.classList.add('press'); setTimeout(() => { btn.classList.remove('press'); fn(); }, 140); }

    startBtn.addEventListener('click', () => press(startBtn, startCall));
    endBtn.addEventListener('click', () => press(endBtn, endCall));
    orbZone.addEventListener('click', () => { if (callActive && speaking) { stopSpeaking(); resumeListening(); } });

    if ('speechSynthesis' in window) {
      const loadVoices = () => { voices = speechSynthesis.getVoices(); };
      loadVoices(); speechSynthesis.onvoiceschanged = loadVoices;
    }

    if (!SpeechRecognition) {
      startBtn.disabled = true; startBtn.style.opacity = '.45'; startBtn.style.cursor = 'not-allowed';
      setStatus('Speech recognition is not supported.');
    } else { initRecognition(); }

    function initAudioCtx() {
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return; if (!audioCtx) audioCtx = new AC();
        if (audioCtx.state === 'suspended') audioCtx.resume();
      } catch (e) {}
    }

    function initRecognition() {
      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.lang = navigator.language || 'en-US';

      recognition.onresult = (event) => {
        if (!callActive || speaking || thinking) return;

        let interim = '';
        let finalAdd = '';

        for (let i = event.resultIndex; i < event.results.length; i++) {
          const chunk = event.results[i][0].transcript || '';
          if (event.results[i].isFinal) finalAdd += chunk + ' ';
          else interim += chunk;
        }

        // Android duplication fix
        if (finalAdd && finalTranscript) {
          const cleanFinal = finalAdd.trim();
          const cleanBuffer = finalTranscript.trim();
          if (cleanFinal.startsWith(cleanBuffer) || cleanFinal === cleanBuffer) {
            finalTranscript = cleanFinal;
          } else if (cleanBuffer.includes(cleanFinal)) {
            // ignore
          } else {
            finalTranscript += ' ' + cleanFinal;
          }
        } else {
          finalTranscript += ' ' + finalAdd;
        }
        
        finalTranscript = finalTranscript.replace(/\s+/g, ' ').trim();
        interimTranscript = interim.replace(/\s+/g, ' ').trim();

        const live = [finalTranscript, interimTranscript].filter(Boolean).join(' ');
        userCaption.textContent = live || '—';

        clearTimeout(silenceTimer);
        if (live.trim()) {
          silenceTimer = setTimeout(() => {
            const text = live.trim().slice(0, 500);
            if (text) {
               sendToQuix(text);
               finalTranscript = '';
               interimTranscript = '';
            }
          }, 1200); // 1.2s pause threshold
        }
      };

      recognition.onerror = (event) => {
        if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
          callActive = false; showCall(false); setState('idle');
          setStatus('Mic blocked. Allow mic and try again.'); return;
        }
        if (callActive && !speaking && !thinking) setTimeout(safeStart, 250);
      };

      recognition.onend = () => {
        if (callActive && !speaking && !thinking) setTimeout(safeStart, 180);
      };
    }

    function safeStart() {
      if (!recognition || !callActive) return;
      try { recognition.start(); setState('listening'); } catch (e) {}
    }

    function stopRecognition() {
      if (!recognition) return;
      try { if (recognition.abort) recognition.abort(); else recognition.stop(); } catch (e) {}
    }

    function stopSpeaking() {
      if (currentAudio) { currentAudio.pause(); currentAudio = null; }
      if ('speechSynthesis' in window) speechSynthesis.cancel();
      analyser = null; speaking = false;
    }

    function startCall() {
      if (!SpeechRecognition) return;
      callActive = true; finalTranscript = ''; interimTranscript = ''; history.length = 0;
      userCaption.textContent = '—'; quixCaption.textContent = 'Connected. Speak.';
      initAudioCtx(); showCall(true); setState('listening'); safeStart();
    }

    function endCall() {
      callActive = false; thinking = false;
      clearTimeout(silenceTimer); stopRecognition(); stopSpeaking();
      showCall(false); setState('idle'); setStatus('Call ended.'); userCaption.textContent = '—';
    }

    function cleanForSpeech(text) {
      return String(text || '').replace(/[*_#`~>|]/g, ' ').replace(/\s+/g, ' ').trim();
    }

    async function sendToQuix(text) {
      if (!callActive || !text.trim()) return;
      clearTimeout(silenceTimer);
      const clean = text.trim();
      userCaption.textContent = clean;

      if (/\b(stop|end|hang up|quit)( the)? call\b|\bhang up\b/i.test(clean)) { endCall(); return; }

      history.push({ role: 'user', text: clean });
      thinking = true; setState('thinking'); stopRecognition();

      try {
        const res = await fetch('/api/chat', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages: history.slice(-16) })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || 'API failed');

        const reply = cleanForSpeech(data.reply || 'I could not get that.');
        history.push({ role: 'assistant', text: reply });
        quixCaption.textContent = reply;
        thinking = false; speak(reply);
      } catch (err) {
        thinking = false;
        quixCaption.textContent = (err.message || 'Signal slipped. Try again.').slice(0, 140);
        if (callActive) resumeListening();
      }
    }

    async function speak(text) {
      if (!callActive) return;
      speaking = true; setState('speaking');

      try {
        const res = await fetch('/api/chat', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ mode: 'tts', text })
        });
        if (!res.ok) throw new Error('TTS failed');
        const blob = await res.blob();
        if (!blob.size) throw new Error('Empty audio');
        if (!callActive) { speaking = false; return; }

        const url = URL.createObjectURL(blob);
        const audio = new Audio(url);
        currentAudio = audio;

        try {
          initAudioCtx();
          if (audioCtx) {
            const src = audioCtx.createMediaElementSource(audio);
            analyser = audioCtx.createAnalyser(); analyser.fftSize = 512;
            timeData = new Uint8Array(analyser.fftSize);
            src.connect(analyser); analyser.connect(audioCtx.destination);
          }
        } catch (e) { analyser = null; }

        let done = false;
        const finish = () => {
          if (done) return; done = true;
          URL.revokeObjectURL(url); currentAudio = null; analyser = null; speaking = false;
          if (callActive) resumeListening();
        };
        audio.onended = finish; audio.onerror = finish;
        await audio.play();
      } catch (e) {
        currentAudio = null; analyser = null; browserSpeak(text);
      }
    }

    function browserSpeak(text) {
      if (!callActive) return;
      speaking = true; setState('speaking');
      if (!('speechSynthesis' in window)) {
        setTimeout(() => { speaking = false; if (callActive) resumeListening(); }, Math.min(2200, 400 + text.length * 28)); return;
      }
      speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.rate = 1.03; utterance.pitch = 1.05;
      const voice = voices.find(v => /en/i.test(v.lang) && /female|samantha|zira|aria|jenny|google us english/i.test(v.name)) || voices.find(v => v.lang.startsWith('en')) || voices[0];
      if (voice) utterance.voice = voice;
      utterance.onend = () => { speaking = false; if (callActive) resumeListening(); };
      utterance.onerror = () => { speaking = false; if (callActive) resumeListening(); };
      speechSynthesis.speak(utterance);
    }

    function resumeListening() {
      if (!callActive) return;
      setState('listening'); safeStart();
    }
  </script>
</body>
</html>
